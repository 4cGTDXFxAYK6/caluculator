ご指摘の現象の原因は次の通りです。

1. **画面が拡大する現象**  
   スマートフォンでキーを連続でダブルタップ（連打）した際に、ブラウザおよびPWA標準の「ダブルタップズーム」機能が働いてしまっています。
2. **見た目や履歴表示が変わった現象**  
   元のデザインやレイアウトを保持せず、完全に別のスタイリングで置き換えてしまったためです。

元の見た目と履歴表示の構造を維持した上で、**「履歴最上段の文字見切れ・ボケ防止」**と**「連打時の画面拡大（ズーム）の防止」**のみを最小限の修正で加えたコードを作成します。

### `index.html`（修正版）

```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- 連打時のズームを防止 (user-scalable=no, viewport-fit=cover) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>電卓アプリ</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      /* 連続タップ時の青いハイライトや拡大アクションを抑制 */
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* 文字上部が滲む・切り取られる現象の防止プロパティ */
    body, button, input, div, span, li {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .calculator {
      background: #ffffff;
      width: 100%;
      max-width: 360px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* --- 計算履歴表示部（見切れ・ぼやけ防止調整） --- */
    .history-container {
      height: 120px;
      background: #f8f9fa;
      border-radius: 8px;
      padding: 8px 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column-reverse;
      /* 小数点ピクセル補間によるボケ防止 */
      transform: translateZ(0);
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      /* スクロール最上段の描画保護 */
      padding-top: 6px;
    }

    .history-item {
      font-size: 14px;
      color: #6c757d;
      text-align: right;
      /* フォント上部の切り抜きを防ぐ行高 */
      line-height: 1.35;
      padding: 2px 0;
      word-break: break-all;
    }

    .history-item:first-child {
      /* 最上段テキストの上部余白を確保 */
      padding-top: 4px;
    }

    /* --- メイン表示部 --- */
    .display-container {
      text-align: right;
      padding: 10px 0;
    }

    .display {
      font-size: 36px;
      font-weight: bold;
      color: #212529;
      line-height: 1.25;
      min-height: 44px;
      word-break: break-all;
    }

    /* --- ボタンレイアウト --- */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      font-size: 20px;
      font-weight: 600;
      padding: 16px 0;
      border: none;
      border-radius: 12px;
      background: #e9ecef;
      color: #212529;
      cursor: pointer;
      transition: background 0.15s ease;
      /* ボタンの長押し選択やダブルタップズームを無効化 */
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    button:active {
      background: #dee2e6;
    }

    button.operator {
      background: #fd7e14;
      color: #ffffff;
    }

    button.operator:active {
      background: #e8590c;
    }

    button.clear, button.delete {
      background: #ced4da;
    }

    button.clear:active, button.delete:active {
      background: #adb5bd;
    }

    button.zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="history-container">
      <ul class="history-list" id="historyList"></ul>
    </div>

    <div class="display-container">
      <div class="display" id="display">0</div>
    </div>

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="delete" onclick="deleteChar()">DEL</button>
      <button class="operator" onclick="appendOperator('%')">%</button>
      <button class="operator" onclick="appendOperator('/')">÷</button>

      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="appendOperator('*')">×</button>

      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="appendOperator('-')">-</button>

      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="operator" onclick="appendOperator('+')">+</button>

      <button class="zero" onclick="appendNumber('0')">0</button>
      <button onclick="appendNumber('.')">.</button>
      <button class="operator" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let currentInput = '0';
    let history = [];

    const displayElement = document.getElementById('display');
    const historyListElement = document.getElementById('historyList');

    // ダブルタップによる拡大（ズーム）をJS側でも防ぐ
    document.addEventListener('touchstart', function(event) {
      if (event.touches.length > 1) {
        event.preventDefault();
      }
    }, { passive: false });

    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(event) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        event.preventDefault();
      }
      lastTouchEnd = now;
    }, false);

    function updateDisplay() {
      displayElement.textContent = currentInput;
    }

    function updateHistory() {
      historyListElement.innerHTML = '';
      history.slice().reverse().forEach(item => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.textContent = item;
        historyListElement.appendChild(li);
      });
    }

    function appendNumber(num) {
      if (currentInput === '0' && num !== '.') {
        currentInput = num;
      } else {
        if (num === '.' && currentInput.includes('.')) return;
        currentInput += num;
      }
      updateDisplay();
    }

    function appendOperator(op) {
      const lastChar = currentInput.slice(-1);
      if (['+', '-', '*', '/', '%'].includes(lastChar)) {
        currentInput = currentInput.slice(0, -1) + op;
      } else {
        currentInput += op;
      }
      updateDisplay();
    }

    function clearDisplay() {
      currentInput = '0';
      updateDisplay();
    }

    function deleteChar() {
      if (currentInput.length === 1) {
        currentInput = '0';
      } else {
        currentInput = currentInput.slice(0, -1);
      }
      updateDisplay();
    }

    function calculate() {
      try {
        const expression = currentInput.replace(/×/g, '*').replace(/÷/g, '/');
        const result = Function('"use strict"; return (' + expression + ')')();
        
        if (result !== undefined && !isNaN(result)) {
          const record = `${currentInput} = ${result}`;
          history.push(record);
          currentInput = String(result);
          updateDisplay();
          updateHistory();
        }
      } catch (error) {
        displayElement.textContent = 'Error';
        setTimeout(() => updateDisplay(), 1200);
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>

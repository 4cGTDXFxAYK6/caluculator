<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電卓アプリ</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .calculator {
      background: #ffffff;
      width: 100%;
      max-width: 360px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 履歴領域のボケ・見切れ防止調整 */
    .history-container {
      height: 120px;
      background: #f8f9fa;
      border-radius: 8px;
      padding: 8px 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column-reverse; /* 最新の履歴を最上段に配置 */
      transform: translateZ(0); /* ハードウェアアクセラレーションで境界のボケを防止 */
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      padding-top: 6px; /* スクロール最上段の余白確保 */
    }

    .history-item {
      font-size: 14px;
      color: #6c757d;
      text-align: right;
      line-height: 1.3; /* OSフォント描画変更に伴う見切れ防止 */
      padding: 2px 0;
      word-break: break-all;
    }

    .history-item:first-child {
      padding-top: 4px; /* 最上段の文字上部スペースをしっかり保護 */
    }

    .display-container {
      text-align: right;
      padding: 10px 0;
    }

    .display {
      font-size: 36px;
      font-weight: bold;
      color: #212529;
      line-height: 1.2;
      min-height: 44px;
      word-break: break-all;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      font-size: 20px;
      font-weight: 600;
      padding: 16px 0;
      border: none;
      border-radius: 12px;
      background: #e9ecef;
      color: #212529;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:active {
      background: #dee2e6;
    }

    button.operator {
      background: #fd7e14;
      color: #ffffff;
    }

    button.operator:active {
      background: #e8590c;
    }

    button.clear, button.delete {
      background: #ced4da;
    }

    button.clear:active, button.delete:active {
      background: #adb5bd;
    }

    button.zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <!-- 計算履歴表示部 -->
    <div class="history-container">
      <ul class="history-list" id="historyList"></ul>
    </div>

    <!-- メインディスプレイ -->
    <div class="display-container">
      <div class="display" id="display">0</div>
    </div>

    <!-- ボタンレイアウト -->
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="delete" onclick="deleteChar()">DEL</button>
      <button class="operator" onclick="appendOperator('%')">%</button>
      <button class="operator" onclick="appendOperator('/')">÷</button>

      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="appendOperator('*')">×</button>

      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="appendOperator('-')">-</button>

      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="operator" onclick="appendOperator('+')">+</button>

      <button class="zero" onclick="appendNumber('0')">0</button>
      <button onclick="appendNumber('.')">.</button>
      <button class="operator" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let currentInput = '0';
    let history = [];

    const displayElement = document.getElementById('display');
    const historyListElement = document.getElementById('historyList');

    function updateDisplay() {
      displayElement.textContent = currentInput;
    }

    function updateHistory() {
      historyListElement.innerHTML = '';
      history.slice().reverse().forEach(item => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.textContent = item;
        historyListElement.appendChild(li);
      });
    }

    function appendNumber(num) {
      if (currentInput === '0' && num !== '.') {
        currentInput = num;
      } else {
        if (num === '.' && currentInput.includes('.')) return;
        currentInput += num;
      }
      updateDisplay();
    }

    function appendOperator(op) {
      const lastChar = currentInput.slice(-1);
      if (['+', '-', '*', '/', '%'].includes(lastChar)) {
        currentInput = currentInput.slice(0, -1) + op;
      } else {
        currentInput += op;
      }
      updateDisplay();
    }

    function clearDisplay() {
      currentInput = '0';
      updateDisplay();
    }

    function deleteChar() {
      if (currentInput.length === 1) {
        currentInput = '0';
      } else {
        currentInput = currentInput.slice(0, -1);
      }
      updateDisplay();
    }

    function calculate() {
      try {
        const expression = currentInput.replace(/×/g, '*').replace(/÷/g, '/');
        // 安全な計算処理評価
        const result = Function('"use strict"; return (' + expression + ')')();
        
        if (result !== undefined && !isNaN(result)) {
          const record = `${currentInput} = ${result}`;
          history.push(record);
          currentInput = String(result);
          updateDisplay();
          updateHistory();
        }
      } catch (error) {
        displayElement.textContent = 'Error';
        setTimeout(() => updateDisplay(), 1200);
      }
    }

    // PWA Service Worker 登録処理
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
